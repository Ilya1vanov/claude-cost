[project]
name = "claude-cost"
version = "0.2.0"
description = "Local, AI-free analysis of what Claude Code usage costs"
requires-python = ">=3.11"
dependencies = ["flask>=3.0,<4"]

[project.scripts]
claude-cost = "claude_cost.cli:main_entry"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_cost"]

[tool.pytest.ini_options]
testpaths = ["tests"]
